# xp project config (xp-plugin 1.0.0)
trunk: develop       # sprints land and tag here; the develop -> main release cut stays ours
versioning: on       # each release is tagged; version_files must match the tag
version_files: packages/beacon/package.json, packages/beacon-client/package.json, apps/server/package.json
worktree_setup: bun install --frozen-lockfile   # in a new story/free worktree, before agents
worktree_teardown: ./scripts/teardown-worktree.sh   # before removal; red warns, removes anyway
debt_budget: 0.2
# codex_sandbox: danger-full-access   # workspace-write | danger-full-access
roles:               # harness/model[/effort]; a card's Executor: line overrides
  # A reviewer that shares the implementer's priors agrees with it for the same reasons, so
  # each seat that argues with work runs in the other model family from the seat that wrote it.
  # The judgment seats (planner, slate-reviewer, angle-reviewer) run on codex's frontier model.
  # The long multi-step seats (executor, fixer) run on the cheaper workhorse at medium, because
  # low effort there cuts corners that only surface at land.
  lead: claude/claude-opus-5-5
  planner: codex/gpt-6-astra/medium
  executor: codex/gpt-6.1-sol/medium
  # claude, so the story diff review is a cross-family look at the codex executor's work.
  reviewer: claude/claude-opus-5-5/medium
  # /high: a plan review costs little next to a story built on a plan nobody argued with.
  plan-reviewer: claude/claude-opus-5-5/high
  # codex, because the lead writes the slate on claude.
  slate-reviewer: codex/gpt-6-astra/medium
  angle-reviewer: codex/gpt-6-astra/medium
  fixer: codex/gpt-6.1-sol/medium
