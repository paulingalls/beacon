# xp project config (xp-plugin 1.0.0)
trunk: develop       # sprints land and tag here; the develop -> main release cut stays ours
versioning: on       # each release is tagged; version_files must match the tag
version_files: packages/beacon/package.json, packages/beacon-client/package.json, apps/server/package.json
debt_budget: 0.2
# codex_sandbox: danger-full-access   # workspace-write | danger-full-access
roles:               # harness/model[/effort]; a card's Executor: line overrides
  lead: codex/gpt-6.1-sol/medium
  planner: codex/gpt-6.1-sol/medium
  executor: codex/gpt-6.1-sol/medium
  reviewer: codex/gpt-6.1-sol/medium
  plan-reviewer: codex/gpt-6.1-sol/medium
  slate-reviewer: codex/gpt-6.1-sol/medium
  angle-reviewer: codex/gpt-6.1-sol/medium   # was finder/verifier in 0.x
  fixer: codex/gpt-6.1-sol/medium
