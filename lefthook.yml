# Runs lint + tests before every commit (SMM constraint: git commit hooks).
# Install the git hooks once with: bunx lefthook install
#
# These hooks ARE the xp wall: .xp/config.yml's tests.fast / tests.story name the
# same package.json scripts, so the tiers have one definition.
#
# pre-commit (xp fast, ~1s) is DB-free: BEACON_TEST_DB=off tells the bun test
# preload (test/setup/ensure-test-db.ts) not to start Postgres, so the
# integration suites skip. pre-push (xp story, ~6s) adds typecheck and the
# DB-backed suites. Both exclude the ~27s subprocess suites in test:slow, which
# run at sprint close (xp full) and in CI.
pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: '*.{ts,tsx,js,jsx,json,jsonc}'
      run: bunx biome check --no-errors-on-unmatched {staged_files}
    - name: test
      run: bun run test:fast
    # No glob: a cap read from config.yml must hold whichever .xp file changed.
    - name: constraints-size
      run: sh scripts/check-constraints-size.sh

pre-push:
  jobs:
    - name: story
      run: bun run typecheck && bun run test:story
