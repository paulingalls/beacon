name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
      - name: Publish gated release
        env:
          TARGET: ${{ github.sha }}
        run: |
          git fetch --unshallow origin "$TARGET"
          git push origin "$TARGET:refs/heads/release"
      - name: Wait for production boot commit
        env:
          TARGET: ${{ github.sha }}
        run: |
          deadline=$((SECONDS + 300))
          while (( SECONDS < deadline )); do
            remaining=$((deadline - SECONDS))
            if (( remaining <= 0 )); then break; fi
            if body=$(curl --fail --silent --show-error --connect-timeout 5 --max-time "$((remaining < 10 ? remaining : 10))" https://beacon.vodshorter.com/health) &&
               jq -e --arg sha "$TARGET" '.status == "ok" and .commit == $sha' <<< "$body" >/dev/null 2>&1; then
              echo "Production booted $TARGET"
              exit 0
            fi
            remaining=$((deadline - SECONDS))
            if (( remaining > 0 )); then sleep "$((remaining < 5 ? remaining : 5))"; fi
          done
          echo "Production did not boot $TARGET within five minutes" >&2
          exit 1
